apiVersion: apps/v1
kind: Deployment
metadata:
  name: l6-ballot
  labels:
    app: l6-ballot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: l6-ballot
  template:
    metadata:
      labels:
        app: l6-ballot
    spec:
      containers:
        - name: ballot
          image: ghcr.io/bngams/kube-vote:3.0
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: l6-ballot-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
