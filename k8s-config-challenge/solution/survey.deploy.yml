apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey
  labels:
    app: survey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: survey
  template:
    metadata:
      labels:
        app: survey
    spec:
      containers:
        - name: survey
          image: ghcr.io/bngams/kube-vote:1.0
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: survey-config
            - secretRef:
                name: survey-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
