title: "Kubernetes, de l'état souhaité à la production"
description: "Déployer une application sur Kubernetes, la casser, la réparer, la mettre à jour et revenir en arrière : une compétence à la fois, sur la même application de vote, à vérifier sur votre cluster."
level: beginner
tags: [kubernetes]
prerequisites: "Savoir utiliser un terminal, et avoir Docker installé. Savoir ce qu'est un conteneur aide, et l'échauffement du premier layer le rappelle."
layers:
