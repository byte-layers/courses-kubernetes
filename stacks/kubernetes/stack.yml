  - title: "Isoler"
    summary: "Un namespace, un quota, un réseau fermé"
    contents:
      - { slug: k8s-namespaces-quotas }
      - { slug: k8s-network-open-by-default }
      - { slug: k8s-network-policies }
      - { slug: k8s-isolation-challenge, role: proof }
  - title: "Configurer"
    summary: "Des réglages et des secrets hors de l'image"
