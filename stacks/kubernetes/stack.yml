      - { slug: why-kubernetes }
      - { slug: k8s-benefits }
      - { slug: k8s-when-to-use }
      - { slug: k8s-overview }
      - { slug: k8s-distribution-choice }
      - { slug: k8s-minikube-install }
      - { slug: k8s-cluster-anatomy }
      - { slug: k8s-install-challenge, role: proof }
  - title: "Déployer"
    summary: "Décrire ce qu'on veut, et voir Kubernetes réparer tout seul"
    contents:
      - { slug: k8s-deployment }
      - { slug: desired-state }
      - { slug: k8s-pod-vs-container-restart }
      - { slug: k8s-deployment-challenge, role: proof }
