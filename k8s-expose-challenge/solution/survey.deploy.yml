# survey : l'application à exposer, 2 réplicas qui écoutent sur le port 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey
  labels:
    app: survey
spec:
  replicas: 2
  selector:
    matchLabels:
      app: survey
  template:
    metadata:
      labels:
        app: survey
    spec:
      containers:
        - name: survey
          image: ghcr.io/bngams/kube-vote:1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
